version: "3"
services:
  easy-test-django:
    build:
      context: .
      dockerfile: ./deployment/django/Dockerfile
    image: easy-test-django
    container_name: easy-test-django
    working_dir: /backend
    environment:
      PYTHONUNBUFFERED: 1
      TZ: Asia/Shanghai
    env_file:
      - .env
    ports:
      - "8000:8000"
    expose:
      - 8000
    restart: always
    networks:
      network:
        ipv4_address: 177.8.0.12

  easy-test-web:
    build:
      context: ./
      dockerfile: ./deployment/web/Dockerfile
    image: easy-test-web
    container_name: easy-test-web
    depends_on:
      - easy-test-django
    ports:
      - "8081:8081"
    expose:
      - 8081
    volumes:
      - ./deployment/web/nginx.conf:/etc/nginx/conf.d/easy_test.conf
    environment:
      TZ: Asia/Shanghai
    restart: always
    networks:
      network:
        ipv4_address: 177.8.0.11

  easy-test-celery:
    build:
      context: .
      dockerfile: ./deployment/celery/Dockerfile
    image: easy-test-celery
    container_name: easy-test-celery
    depends_on:
      - easy-test-mysql
    environment:
      PYTHONUNBUFFERED: 1
      TZ: Asia/Shanghai
    env_file:
      - .env
    restart: always
    networks:
      network:
        ipv4_address: 177.8.0.14

  easy-test-proxy:
    build:
      context: .
      dockerfile: ./deployment/proxy/Dockerfile
    image: easy-test-proxy
    container_name: easy-test-proxy
    depends_on:
      - easy-test-django
    environment:
      PYTHONUNBUFFERED: 1
      TZ: Asia/Shanghai
    env_file:
      - .env
    ports:
      - "7778:7778"
    expose:
      - 7778
    restart: always
    networks:
      network:
        ipv4_address: 177.8.0.16

  easy-test-mysql:
    # 如果您是 arm64 架构：如 MacOS 的 M1，请修改镜像为 image: mysql/mysql-server:5.7
    image: mysql:5.7
    container_name: easy-test-mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    privileged: true
    restart: always
    ports:
      - "3306:3306"
    expose:
      - 3306
    environment:
      MYSQL_DATABASE: "easytest"
      MYSQL_ROOT_PASSWORD: "root"
      TZ: Asia/Shanghai
    volumes:
      - mysql:/var/lib/mysql
      - ./deployment/mysql/conf.d:/etc/mysql/conf.d
      - ./deployment/mysql/init:/docker-entrypoint-initdb.d
      - ./deployment/mysql/logs:/logs
    networks:
      network:
        ipv4_address: 177.8.0.13

  easy-test-rabbitmq:
    image: rabbitmq:3-management
    container_name: easy-test-rabbitmq
    restart: always
    ports:
      - "5672:5672"
    expose:
      - 5672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      network:
        ipv4_address: 177.8.0.15

  easy-test-redis:
    image: redis:6.2.6-alpine
    container_name: easy-test-redis
    restart: always
    ports:
      - "6379:6379"
    expose:
      - 6379
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass 123456
    volumes:
      - redis:/data
      - ./deployment/redis/redis.conf:/etc/redis/redis.conf
    networks:
      network:
        ipv4_address: 177.8.0.17

volumes:
    mysql:
    rabbitmq:
    redis:

networks:
    network:
        ipam:
            driver: default
            config:
                - subnet: '177.8.0.0/16'